id: pos2gis_converter
name: 点云 POS 轨迹转换 GIS
kind: go
category: KD测试工具 > 点云处理工具
icon: go
description: 将 POS JSON 轨迹批量转换为 GeoJSON 与点 Shapefile。
docs:
  summary: 将点云 POS 编译系统导出的 JSON 轨迹批量转为 GeoJSON 与点 Shapefile。
  usage: |
    将点云 POS 编译系统导出的 JSON 轨迹目录批量转换为 GIS 可用的 GeoJSON 与点 Shapefile。

    输入规则：
    - input 为包含 POS JSON 文件的目录，程序会遍历目录下所有 .json 文件

    输出规则：
    - 可单独输出 GeoJSON、点 Shapefile，或两者同时输出
    - 不填写 output 时默认在输入目录下生成 output 目录

    常用示例：
    - -input D:\pos_json_dir -output D:\gis_out -artifact-set all -workers 4
params:
  - key: input
    argKey: input
    type: path
    pathMode: directory
    label: 输入目录
    placeholder: 选择包含 POS JSON 文件的目录
    required: true
    help: 程序会遍历目录下所有 .json 文件并进行转换。
  - key: output
    argKey: output
    type: path
    pathMode: directory
    label: 输出目录
    placeholder: 留空则在输入目录下生成 output
    help: 不填写时在输入目录下生成 output 目录。
  - key: artifactSet
    argKey: artifact-set
    type: select
    label: 输出内容
    default: all
    help: 选择输出 GeoJSON、点 Shapefile，还是两者都输出。
    options:
      - label: GeoJSON + 点SHP
        value: all
      - label: 仅 点SHP
        value: shp
      - label: 仅 GeoJSON
        value: geojson
  - key: workers
    argKey: workers
    type: number
    label: 并发数
    default: 4
    help: 并行处理 JSON 文件的线程数，量大的场景提高并发可显著加速。
execution:
  local:
    adapter: go-binary
  remote:
    strategy: upload-binary-and-run
export:
  strategy: export-binary
source:
  entry: tools/go_tools/pos_trajectory_to_gis/tool.go
