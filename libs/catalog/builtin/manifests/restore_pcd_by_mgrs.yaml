id: restore_pcd_by_mgrs
name: 白犀牛 PCD 偏转还原 LAS
kind: python
category: KD测试工具 > 点云处理工具 > 白犀牛项目工具
icon: python
description: 根据文件名中的 MGRS 百米块信息恢复原始 UTM 坐标系的 LAS 文件。
docs:
  summary: 根据文件名中 MGRS 百米块信息，将偏转后的 PCD 文件恢复为原始 UTM 坐标系的 LAS 文件。
  usage: |
    将经过白犀牛偏转处理的 PCD 文件恢复为原始 UTM 坐标系的 LAS 文件。

    输入规则：
    - input 为包含 .pcd 文件的目录
    - 程序根据文件名中的 MGRS 百米块信息自动确定 UTM 坐标

    常用示例：
    - -input D:\pcd_dir -output D:\las_out -workers 4
params:
  - key: input
    argKey: input
    type: path
    label: 输入目录
    placeholder: 选择包含 .pcd 文件的目录
    required: true
    help: 包含原始 PCD 文件的目录。
  - key: output
    argKey: output
    type: path
    label: 输出目录
    placeholder: 可选，默认在输入目录下创建 output 目录
    help: 输出 LAS 文件的目录。
  - key: workers
    argKey: workers
    type: number
    label: 并发数
    default: 1
    help: Python 脚本并行处理的线程数。
execution:
  local:
    adapter: python-script
  remote:
    strategy: upload-script-and-run
export:
  strategy: export-script
source:
  entry: tools/python_tools/scripts/restore_pcd_by_mgrs.py
