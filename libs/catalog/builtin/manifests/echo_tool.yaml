id: echo_tool
name: Echo 测试工具
kind: go
category: 通用测试工具 > 验证
icon: go
description: 新模型验证工具，回显参数到日志面板。
docs:
  summary: 用于验证统一工具接入模型的纯库包 Go 工具。
  usage: |
    回显输入参数到日志面板，用于验证新接入模型的本地执行、远程执行和导出链路。
params:
  - key: input
    argKey: input
    type: path
    label: 输入路径
    placeholder: 任意路径用于测试
  - key: label
    argKey: label
    type: string
    label: 标签
    default: echo
execution:
  local:
    adapter: go-binary
  remote:
    strategy: upload-binary-and-run
export:
  strategy: export-binary
source:
  entry: tools/go_tools/echo_tool/tool.go
