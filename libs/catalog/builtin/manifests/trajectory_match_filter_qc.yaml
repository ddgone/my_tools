id: trajectory_match_filter_qc
name: 轨迹点匹配筛选质检
kind: go
category: KD测试工具 > 点云处理工具
icon: go
description: 基于基准轨迹点与待测轨迹点的空间匹配结果，输出保留/舍弃筛选结果及汇总产物。
docs:
  summary: 面向点轨迹 Shapefile 的空间匹配质检工具，支持单文件或目录输入、连续匹配统计和保留/舍弃汇总输出。
  usage: |
    本工具读取基准轨迹点 SHP 和待测轨迹点 SHP，按照空间误差阈值做点级匹配，
    并基于连续匹配段输出保留/舍弃判断。

    输入规则：
    - base 支持单个点 SHP 文件或目录
    - input 支持单个点 SHP 文件或目录
    - 目录模式下只扫描当前层的点 SHP，不处理 _line.shp
    - 如果待测集合中包含和基准集合同名同路径文件，会自动剔除

    输出内容：
    - summary.csv：每个待测轨迹的统计结果
    - detail.csv：连续匹配段明细
    - res.txt / drop.txt：保留与舍弃名单
    - res_merged_point.shp / drop_merged_point.shp：可选汇总点图层

    常用示例：
    - -base D:\base -input D:\target -output D:\qc_out
    - -base D:\base\a_point.shp -input D:\target -error 0.05 -order-by timestamp
    - -base D:\base -input D:\target -merge=false
params:
  - key: base
    argKey: base
    type: path
    pathMode: fileOrDirectory
    label: 基准轨迹点 SHP
    placeholder: 选择基准点 SHP 文件或目录
    required: true
    help: 支持单个点 SHP 文件，或包含多个点 SHP 的目录。
  - key: input
    argKey: input
    type: path
    pathMode: fileOrDirectory
    label: 待测轨迹点 SHP
    placeholder: 选择待测点 SHP 文件或目录
    required: true
    help: 支持单个点 SHP 文件，或包含多个点 SHP 的目录。
  - key: output
    argKey: output
    type: path
    pathMode: directory
    label: 输出目录
    default: output
    placeholder: 留空则默认输出到当前目录下的 output
  - key: error
    argKey: error
    type: number
    label: 空间误差阈值（米）
    default: 0.02
    help: 两个点在该阈值内即视为匹配。
  - key: merge
    argKey: merge
    type: boolean
    label: 输出汇总点 SHP
    default: true
    help: 为保留结果和舍弃结果分别输出汇总点 Shapefile，同时兼容旧参数拼写 mearge。
  - key: orderBy
    argKey: order-by
    type: select
    label: 目标点排序方式
    default: pointIndex
    options:
      - label: pointIndex
        value: pointIndex
      - label: record
        value: record
      - label: timestamp
        value: timestamp
    help: 控制待测点序列的排序依据。
  - key: threads
    argKey: threads
    type: number
    label: 并发数
    default: 4
    help: 并发处理待测轨迹文件的线程数。
  - key: timeout
    argKey: timeout
    type: string
    label: 总超时
    placeholder: 例如 2m、30s；留空表示不限制
    help: 可选，使用 Go duration 格式。
  - key: verbose
    argKey: verbose
    type: boolean
    label: 输出调试日志
    default: false
execution:
  local:
    adapter: go-binary
  remote:
    strategy: upload-binary-and-run
export:
  strategy: export-binary
source:
  entry: tools/go_tools/trajectory_match_filter_qc/tool.go
