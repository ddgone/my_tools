id: bxn_track_merger
name: 白犀牛 Route 轨迹合并与 GIS 转换
kind: go
category: KD测试工具 > 点云处理工具 > 白犀牛项目工具
icon: go
description: 读取 Route JSON 轨迹目录，合并输出 GeoJSON LineString 与 POLYLINEZ Shapefile，附带 WGS84 投影文件。
docs:
  summary: 将白犀牛 Route JSON 轨迹目录中的多条轨迹合并，输出单文件与合并后的 GIS 产物（GeoJSON LineString + Shapefile POLYLINEZ）。
  usage: |
    读取指定目录下的 Route JSON 轨迹文件，解析轨迹点并按时间戳排序。

    输入格式支持两种：
    - Format A: {"trackList": [{"trackId": "...", "pointList": [...]}]}
    - Format B: {"trackId": "...", "pointList": [...]}

    输出内容：
    - 每个输入 JSON 对应一对 GeoJSON（LineString）+ SHP（POLYLINEZ）
    - merged.geojson / merged.shp：多文件合并产物（仅当输入文件数 > 1 时生成）
    - 所有 SHP 附带 WGS84 .prj 投影文件

    常用示例：
    - 全部输出：  -input D:\route_dir -output D:\gis_out -artifact-set all -workers 8
    - 仅 SHP：    -input D:\route_dir -output D:\gis_out -artifact-set shp
    - 不合并：    -input D:\route_dir -output D:\gis_out -merge=false
params:
  - key: input
    argKey: input
    type: path
    pathMode: directory
    label: 输入目录
    placeholder: 选择包含 route JSON 文件的目录
    required: true
    help: 程序会遍历目录下所有 .json 文件并进行转换。
  - key: output
    argKey: output
    type: path
    pathMode: directory
    label: 输出目录
    placeholder: 留空则在输入目录下创建 output
    help: 单文件轨迹和合并产物都输出到这个目录。
  - key: artifactSet
    argKey: artifact-set
    type: select
    label: 输出内容
    default: all
    help: 选择输出 GeoJSON LineString、POLYLINEZ Shapefile，或两者都输出。
    options:
      - label: GeoJSON + SHP
        value: all
      - label: 仅 GeoJSON
        value: geojson
      - label: 仅 SHP
        value: shp
  - key: workers
    argKey: workers
    type: number
    label: 并发数
    default: 4
    help: 并行处理 JSON 文件的线程数。
  - key: merge
    argKey: merge
    type: boolean
    label: 输出合并产物
    default: true
    help: 输入文件数 > 1 时，额外生成 merged.geojson 和 merged.shp。
execution:
  local:
    adapter: go-binary
  remote:
    strategy: upload-binary-and-run
export:
  strategy: export-binary
source:
  entry: tools/go_tools/bxn_route_track_merger/tool.go
