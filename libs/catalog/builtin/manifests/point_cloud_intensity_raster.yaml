id: point_cloud_intensity_raster
name: 点云强度图生成
kind: rust
category: KD测试工具 > 点云处理工具
icon: rust
description: 对 LAS/LAZ 点云生成强度图 PNG 及 GIS 侧车文件，支持单文件或目录批量并发处理。
docs:
  summary: 将 LAS/LAZ 点云的强度值栅格化为 PNG 灰度图，附带 GIS 配准配套文件。支持单文件或目录批量处理，并发加速。
  usage: |
    将 LAS/LAZ 点云的强度值栅格化为 PNG 灰度图，自动生成配套的 GIS 配准文件。

    输入规则：
    - input 支持单个 las/laz 文件，或包含多个点云文件的目录
    - 目录模式下只扫描当前层，不递归子目录
    - 目录输入时，每个文件在输出目录下建同名子目录存放结果

    输出内容：
    - png 强度图
    - pgw 世界文件
    - prj 投影文件
    - aux.xml 辅助元数据
    - vrt GDAL 虚拟栅格

    常用示例：
    - --input D:\clouds --output D:\raster_out --resolution 0.5 --threads 8
    - --input D:\clouds\a.las --output D:\raster_out --resolution 0.2
    - --input D:\clouds --output D:\raster_out --resolution 1.0 --force
    - --input D:\clouds --output D:\raster_out --epsg 32650
params:
  - key: input
    argKey: input
    type: path
    pathMode: fileOrDirectory
    label: 输入点云
    placeholder: 选择 LAS/LAZ 文件或目录
    required: true
    help: 支持单个 las/laz 文件，或包含多个点云文件的目录。
  - key: output
    argKey: output
    type: path
    pathMode: directory
    label: 输出目录
    placeholder: 选择强度图输出目录
    required: true
    help: 工具会在每个 LAS/LAZ 文件对应的子目录下输出 PNG 与 GIS 侧车文件。
  - key: resolution
    argKey: resolution
    type: number
    label: 分辨率（米/像素）
    default: 0.5
    help: 强度图的栅格分辨率。
  - key: threads
    argKey: threads
    type: number
    label: 并发数
    default: 4
    help: 控制目录批处理和内部栅格计算的线程数。
  - key: force
    argKey: force
    type: boolean
    label: 覆盖已有输出
    default: false
    help: 启用后允许覆盖已存在的目标文件。
  - key: epsg
    argKey: epsg
    type: number
    label: EPSG 代码
    default: 32650
    help: 当 LAS 文件缺少 CRS 元数据时，使用此 EPSG 生成 GIS 投影文件。
execution:
  local:
    adapter: rust-binary
  remote:
    strategy: upload-binary-and-run
export:
  strategy: export-binary
source:
  entry: tools/rust_tools/point_cloud_intensity_raster/src/lib.rs
