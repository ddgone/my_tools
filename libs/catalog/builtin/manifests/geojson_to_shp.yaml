id: geojson_to_shp
name: GeoJSON 转 Shapefile
kind: go
category: KD测试工具 > 点云处理工具
icon: go
description: 将 GeoJSON 文件或目录批量转换为点 Shapefile。
docs:
  summary: 将单个或多个 GeoJSON 文件批量转换为点 Shapefile，输出 merged_points。
  usage: |
    将单个或目录内的 GeoJSON 文件批量转换为点 Shapefile。

    输入规则：
    - input 支持单个 .geojson 文件，或包含多个 .geojson 的目录
    - 输出为统一的 merged_points 点图层

    常用示例：
    - -input D:\geojson_dir -output D:\shp_out
params:
  - key: input
    argKey: input
    type: path
    label: 输入文件或目录
    placeholder: 选择 .geojson 文件或目录
    required: true
    help: 可以是单个 GeoJSON 文件，也可以是包含多个 GeoJSON 的目录。
  - key: output
    argKey: output
    type: path
    label: 输出目录
    placeholder: 留空则自动在输入位置生成 output
    help: 不填写时自动在输入位置生成 output 目录。
execution:
  local:
    adapter: go-binary
  remote:
    strategy: upload-binary-and-run
export:
  strategy: export-binary
source:
  entry: tools/go_tools/geojson_to_shapefile/tool.go
