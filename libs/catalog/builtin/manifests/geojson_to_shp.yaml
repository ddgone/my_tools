id: geojson_to_shp
name: GeoJSON转Shapefile工具
kind: go
category: KD测试工具 > 点云处理工具
icon: go
description: 将 GeoJSON 文件或目录批量转换为点 Shapefile。
docs:
  summary: 适用于单个 GeoJSON 文件或整个目录的批量转换，输出 merged_points。
  usage: |
    这是旧版 TUI 中的 GeoJSON 转 Shapefile 工具的桌面化入口。
    结构化表单覆盖最常用的输入和输出目录模式。
params:
  - key: input
    argKey: input
    type: path
    label: 输入文件或目录
    placeholder: 选择 .geojson 文件或目录
    required: true
    help: 可以是单个 GeoJSON 文件，也可以是包含多个 GeoJSON 的目录。
  - key: output
    argKey: output
    type: path
    label: 输出目录
    placeholder: 留空则自动在输入位置生成 output
    help: 不填写时会沿用旧版默认行为。
execution:
  local:
    adapter: go-binary
  remote:
    strategy: upload-binary-and-run
export:
  strategy: export-binary
source:
  entry: tools/go_tools/geojson_to_shapefile/tool.go
