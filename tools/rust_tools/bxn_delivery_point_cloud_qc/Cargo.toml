[package]
name = "bxn_delivery_point_cloud_qc"
version = "1.0.0"
edition = "2024"

[lib]
name = "bxn_delivery_point_cloud_qc"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
byteorder = "1.5"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
flate2 = "1.1"
glam = "0.33.1"
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
las = { version = "0.9.10", features = ["laz-parallel"] }
rayon = "1.12"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
