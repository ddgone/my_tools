[package]
name = "point_cloud_intensity_raster"
version = "1.0.0"
edition = "2024"

[lib]
name = "point_cloud_intensity_raster"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
las = { version = "0.9.10", features = ["laz-parallel"] }
rayon = "1.12"
rustc-hash = "2.1"
