[package]
name = "point_cloud_batch_merge"
version = "1.0.0"
edition = "2021"

[lib]
name = "point_cloud_batch_merge"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
byteorder = "1.5"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
glam = "0.33.1"
las = { version = "0.9.10", features = ["laz-parallel"] }
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
